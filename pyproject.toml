[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yingdao-rpa-toolkit"
version = "0.1.1"
description = "影刀 RPA 开放 API 命令行工具包（WorkBuddy Skill，运行时零第三方依赖）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yd = "yingdao_rpa.cli:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
packages = ["yingdao_rpa", "yingdao_rpa.commands"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
